<!doctype html>
<html lang="ne">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1b2535">
  <title>नेपाल भर्चुअल गाउँ · Nepal Virtual Village</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "playcanvas": "./vendor/playcanvas.mjs" } }</script>
</head>
<body>
  <canvas id="app" aria-label="360° / 3D"></canvas>
  <div id="hotspots"></div>

  <!-- ============ landing: stage select ============ -->
  <section id="landing" class="screen" aria-labelledby="landing-title">
    <div class="land-bg" aria-hidden="true"></div>
    <header class="land-top">
      <div class="brand">
        <h1 id="landing-title" lang="ne"></h1>
        <p id="landing-title-sub"></p>
      </div>
      <div class="land-tools">
        <div class="seg" id="lang-chips" role="group" data-i18n-aria="langLabel"></div>
        <button id="landing-passport" class="hud-pill" data-icon="award" data-i18n-aria="passport"><span id="land-pp-count"></span></button>
        <button id="btn-reset" class="hud-btn hidden" data-icon="restart" data-i18n-aria="reset"></button>
      </div>
    </header>
    <ol class="stage-grid" id="stage-grid"></ol>
  </section>

  <!-- ============ tour chrome ============ -->
  <header id="topbar" class="tour-ui">
    <button id="btn-home" class="hud-btn" data-icon="map" data-i18n-aria="home"></button>
    <div class="top-actions">
      <button id="btn-passport" class="hud-pill" data-icon="award" data-i18n-aria="passport"><span id="pp-count">0/6</span></button>
      <div class="lang-wrap">
        <button id="btn-lang" class="hud-btn lang-btn" aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu"></button>
        <div id="lang-menu" class="lang-menu hidden" role="group"></div>
      </div>
    </div>
  </header>

  <aside id="mission" class="tour-ui" aria-labelledby="m-title">
    <div class="m-head"><span id="m-emoji" class="m-emoji" aria-hidden="true"></span><h2 id="m-title"></h2></div>
    <ol id="m-dots" class="dots" role="list"></ol>
    <div class="m-target">
      <button id="btn-listen" class="guide-btn" data-i18n-aria="listen">
        <span class="avatar m-pic" id="m-pic"></span><span class="spk" data-icon="volume"></span>
      </button>
      <div id="m-word" class="m-word" aria-live="polite"></div>
    </div>
    <p id="m-hint" class="m-hint hidden" aria-live="polite"></p>
    <div class="m-actions">
      <button id="btn-hint" class="hud-btn" data-icon="bulb" data-i18n-aria="hint"></button>
      <button id="btn-other" class="hud-btn" data-icon="shuffle" data-i18n-aria="other"></button>
      <button id="btn-act" class="btn btn-go hidden" data-icon="play"><span data-i18n="play"></span></button>
    </div>
  </aside>

  <aside id="minimap" class="tour-ui" aria-labelledby="map-title">
    <h2 class="sr-only" id="map-title" data-i18n="mapLabel"></h2>
    <svg id="map-svg" viewBox="0 0 200 200"></svg>
  </aside>

  <div id="walk-pad" class="tour-ui hidden">
    <button data-move="f" data-walk class="pad-btn" data-icon="up"></button>
    <div class="pad-row">
      <button data-move="l" data-walk class="pad-btn" data-icon="left"></button>
      <button data-move="b" data-walk class="pad-btn" data-icon="down"></button>
      <button data-move="r" data-walk class="pad-btn" data-icon="right"></button>
    </div>
  </div>

  <div id="status" class="status hidden" role="status"><span class="spinner" aria-hidden="true"></span><span class="sr-only" id="status-text"></span></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- ============ stage intro ============ -->
  <div id="stage-intro" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="si-title">
    <div class="modal-card intro-card">
      <div class="si-art"><span class="si-emoji" id="si-emoji" aria-hidden="true"></span></div>
      <h3 id="si-title" lang="ne"></h3>
      <p id="si-tr" class="tr-line"></p>
      <ul id="si-items" class="si-items" aria-hidden="true"></ul>
      <div class="row">
        <button id="si-back" class="icon-btn" data-icon="left" data-i18n-aria="backToStages"></button>
        <button id="si-start" class="btn btn-go btn-lg" data-icon="play"><span data-i18n="startStage"></span></button>
      </div>
    </div>
  </div>

  <!-- ============ word card: Tharu -> Nepali -> English ============ -->
  <div id="word-card" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="wc-ne">
    <div class="modal-card word-card">
      <button id="wc-close" class="icon-btn" data-icon="x" data-i18n-aria="close"></button>
      <div id="wc-media" class="wc-media"></div>
      <div class="wc-text">
        <div id="wc-tri" class="tri"></div>
        <div id="wc-say" class="wc-say"></div>
        <ul id="wc-facts" class="facts"></ul>
        <button id="wc-ok" class="btn btn-go btn-lg btn-block" data-icon="check" data-i18n-aria="ok"></button>
      </div>
    </div>
  </div>

  <!-- ============ stage game ============ -->
  <div id="activity" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="act-title">
    <div class="modal-card act-card">
      <h3 id="act-title" class="sr-only"></h3>
      <div class="act-head">
        <button id="act-listen" class="icon-btn go" data-icon="volume" data-i18n-aria="listen"></button>
        <div class="act-prompt"><p id="act-prompt-ne" lang="ne"></p><p id="act-prompt-tr" class="tr-line"></p></div>
        <button id="act-close" class="icon-btn ghost" data-icon="x" data-i18n-aria="close"></button>
      </div>
      <div id="act-body"></div>
      <p id="act-feedback" class="feedback" role="status" aria-live="polite"></p>
      <button id="act-finish" class="btn btn-go btn-lg hidden" data-icon="award"><span data-i18n="getStamp"></span></button>
    </div>
  </div>

  <!-- ============ passport ============ -->
  <div id="passport" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="pp-title">
    <div class="modal-card passport-card">
      <div class="pp-head">
        <span class="pp-badge" data-icon="award" aria-hidden="true"></span>
        <h3 id="pp-title" lang="ne">मेरो गाउँ राहदानी</h3>
        <button id="pp-close" class="icon-btn ghost" data-icon="x" data-i18n-aria="close"></button>
      </div>
      <p id="pp-msg" class="pp-msg hidden" role="status"></p>
      <ol id="pp-stamps" class="stamps"></ol>
      <ul id="pp-words" class="word-chips"></ul>
      <button id="pp-stages" class="btn btn-go hidden" data-icon="map"><span data-i18n="backToStages"></span></button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
